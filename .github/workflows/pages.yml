name: Deploy development and production to GitHub Pages
run-name: Deploy Pages from ${{ github.ref_name }} (${{ github.event_name }})

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production
        uses: actions/checkout@v4
        with:
          ref: main
          path: production

      - name: Check out development
        uses: actions/checkout@v4
        with:
          ref: develop
          path: development

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            production/package-lock.json
            development/package-lock.json

      - name: Install production dependencies
        working-directory: production
        run: npm ci

      - name: Build production
        working-directory: production
        env:
          VITE_APP_ENV: production
          VITE_BLOG_MEDIA_BASE: /bde-web/blog-media/
        run: npm run build -- --base=/bde-web/

      - name: Install development dependencies
        working-directory: development
        run: npm ci

      - name: Build development
        working-directory: development
        env:
          VITE_APP_ENV: development
          VITE_BLOG_MEDIA_BASE: /bde-web/blog-media/
        run: npm run build -- --base=/bde-web/dev/

      - name: Share media and assemble the Pages artifact
        run: |
          if [[ -f development/scripts/preparePagesArtifact.mjs ]]; then
            node development/scripts/preparePagesArtifact.mjs production/dist development/dist
          else
            node production/scripts/preparePagesArtifact.mjs production/dist development/dist
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: production/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish environment URLs
        run: |
          echo "### GitHub Pages environments" >> "$GITHUB_STEP_SUMMARY"
          echo "- Production: https://lukedwards99.github.io/bde-web/" >> "$GITHUB_STEP_SUMMARY"
          echo "- Development: https://lukedwards99.github.io/bde-web/dev/" >> "$GITHUB_STEP_SUMMARY"
